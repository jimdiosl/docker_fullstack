
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<link type="text/css" rel="stylesheet" href="https://unpkg.com/bootstrap/dist/css/bootstrap.min.css" />
<link type="text/css" rel="stylesheet" href="https://unpkg.com/bootstrap-vue@latest/dist/bootstrap-vue.min.css" />
<title>🔥 ULIMA - SISTEMAS OPERATIVOS 2026-1 </title>
  <style>
    body {
      background:whitesmoke;
      color: black;
    }
    h1 {
      background: linear-gradient(to right, rgb(254, 58, 0), #fb4921);
      padding: 16px;
      border-radius: 8px;
      color: white;
    }
    label, input, .form-control {
      color: rgb(0, 0, 0);
    }
    .form-control {
      background-color: #f6f3f3;
      border: 1px solid rgb(254, 58, 0);
    }
    .btn-outline-info:hover {
      background-color: rgb(254, 58, 0);
      color: white;
    }
    .btn-outline-danger {
      color: #dc3545;
      border-color: #dc3545;
    }
    .btn-outline-danger:hover {
      background-color: #dc3545;
      color: white;
    }
    .table {
      background-color: #111;
      color: white;
    }
    .table th {
      background-color: rgb(254, 58, 0);
      color: white;
    }
    .table-striped tbody tr:nth-of-type(odd) {
      background-color: whitesmoke;
    }
  </style>
</head>
<body>
<div class="container" id="vuejscrudapp">
    <div class="row">
        <div class="col-md-12 mt-5">
          <h1 class="text-center">🔥 ULIMA - SISTEMAS OPERATIVOS 2026-1 💻</h1>
          <hr style="border-color: rgb(254, 58, 0);">
        </div>
    </div> 
    <div class="row">
        <div class="col-md-12">
          <!-- Add Records -->
        <div>
            <b-button id="show-btn" @click="showModal('my-modal')">Agregar Registro</b-button>
  
            <b-modal ref="my-modal" hide-footer title="Add Records">
              <div>
                <form action="" @submit.prevent="onSubmit">
                  <div class="form-group">
                    <label for="">👤Nombre</label>
                    <input type="text" v-model="firstname" class="form-control">
                  </div>
                  <div class="form-group">
                    <label for="">👥 Apellido</label>
                    <input type="text" v-model="lastname" class="form-control">
                  </div>
                  <div class="form-group">
                    <label for="">📍Ciudad</label>
                    <input type="text" v-model="address" class="form-control">
                  </div>
                  <div class="form-group">
                    <button class="btn btn-sm btn-outline-info">Agregar Registro</button>
                  </div>
                </form>
              </div>
              <b-button class="mt-3" variant="outline-danger" block @click="hideModal('my-modal')">Cerrar</b-button>
            </b-modal>
        </div>
  
        <!-- Update Record -->
        <div>
            <b-modal ref="my-modal1" hide-footer title="Update Record">
              <div>
                <form action="" @submit.prevent="onUpdate">
                  <div class="form-group">
                    <label for="">Nombre</label>
                    <input type="text" v-model="edit_id">
                    <input type="text" v-model="edit_firstname" class="form-control">
                  </div>
                  <div class="form-group">
                    <label for="">Apellido</label>
                    <input type="text" v-model="edit_lastname" class="form-control">
                  </div>
                  <div class="form-group">
                    <label for="">Ciudad</label>
                    <input type="text" v-model="edit_address" class="form-control">
                  </div>
                  <div class="form-group">
                    <button class="btn btn-sm btn-outline-info">Actualizar</button>
                  </div>
                </form>
              </div>
              <b-button class="mt-3" variant="outline-danger" block @click="hideModal('my-modal1')">Cerrar</b-button>
            </b-modal>
          </div>
           
        </div>
    </div>
       
    <div class="row">
        <div class="col-md-12">
          <table class="table table-striped table-bordered">
            <thead>
              <tr>
                <th>ID</th>
                <th>👤Nombre</th>
                <th>👥  Apellido</th>
                <th>📍Ciudad</th>
                <th>Opciones</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(record, i) in records" :key="record.id">
                <td>{{i + 1}}</td>
                <td>{{record.firstname}}</td>
                <td>{{record.lastname}}</td>
                <td>{{record.address}}</td>
                <td>
                  <button @click="deleteRecord(record.id)" class="btn btn-sm btn-outline-danger">Eliminar</button>
                  <button @click="editRecord(record.id)" class="btn btn-sm btn-outline-info">Editar</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
    </div>
</div>
  
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
<!-- BootstrapVue js -->
<script src="https://unpkg.com/bootstrap-vue@latest/dist/bootstrap-vue.min.js"></script>
<!-- Axios -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    var app = new Vue({
        el: '#vuejscrudapp',
        data: {
            firstname: '',
            lastname: '',
            address: '',
            records: [],
            edit_id: '',
            edit_firstname: '',
            edit_lastname: '',
            edit_address: ''
        },
  
        methods: {
            showModal(id) {
                this.$refs[id].show()
            },
            hideModal(id) {
                this.$refs[id].hide()
            },
  
            onSubmit(){
                if (this.firstname !== '' && this.lastname !== '' && this.address !== '') {
                    var config = { headers: {  
                        'Content-Type': 'application/json',
                        'Access-Control-Allow-Origin': '*'}
                    }
                    axios.post("http://0.0.0.0:5000/insert",
                        { firstname : this.firstname, lastname : this.lastname, address : this.address}, config
                    )
                    .then(res => {
                        console.log(res)
                        alert('New record Successfully added')
                        this.firstname = ''
                        this.lastname = ''
                        this.address = ''
          
                        app.hideModal('my-modal')
                        app.getRecords()
                    })
                    .catch(err => {
                        console.log(err)
                    })
                }else{
                  alert('empty')
                }
            },
  
            getRecords(){
                axios({
                  url: 'http://0.0.0.0:5000',
                  method: 'get'
                })
                .then(res => {
                  console.log(res)
                  this.records = res.data.members
                })
                .catch(err => {
                  console.log(err)
                })
            },
  
            editRecord(id){
                axios.get("http://0.0.0.0:5000/edit/" + id)
                .then(res => {
                    console.log(res.data)
                    this.edit_id = res.data.editmember['id']
                    this.edit_firstname = res.data.editmember['firstname']
                    this.edit_lastname = res.data.editmember['lastname']
                    this.edit_address = res.data.editmember['address']
                    app.showModal('my-modal1')
                })
                .catch(err => {
                  console.log(err)
                })
            },
             
            onUpdate(){
                if (this.edit_firstname !== '' && this.edit_lastname !== '' && this.edit_address !== '' && this.edit_id !== '') {
 
                    var config = { headers: {  
                        'Content-Type': 'application/json',
                        'Access-Control-Allow-Origin': '*'}
                    }
                    axios.post("http://0.0.0.0:5000/update", 
                        { edit_id : this.edit_id, edit_firstname : this.edit_firstname, edit_lastname : this.edit_lastname, edit_address : this.edit_address}, config
                    )
                    .then(res => {
                        console.log(res)
                        alert('record update');
          
                        this.edit_firstname = '';
                        this.edit_lastname = '';
                        this.edit_address = '';
                        this.edit_id = '';
          
                        app.hideModal('my-modal1');
                        app.getRecords();
                    })
                      .catch(err => {
                        console.log(err)
                    })
      
                }else{
                  alert('empty')
                }
            },
             
            deleteRecord(id){
                if (window.confirm('Delete this record')) {
                    axios.get("http://0.0.0.0:5000/delete/" + id)
                    .then(res => {
                        console.log(res)
                        alert('delete successfully')
                        app.getRecords();
                    })
                    .catch(err => {
                        console.log(err)
                    })
                }
            },
         
        },
           
        mounted: function(){
          this.getRecords()
        }
    })
</script>
</body>   
</html>
